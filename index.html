<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NUMBER MISSION</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">

    <!-- STAGE 1 -->
    <section id="stage" class="screen active">
      <h1>STAGE 1</h1>
      <button id="stageStart" class="btn">スタート</button>
    </section>

    <!-- RULES -->
    <section id="rules" class="screen">
      <h2>ルール</h2>
      <p class="rulesText">指定された数字を探し、裏に<br>あるアルファベットを入力しろ</p>
      <p class="penaltyRule">※ 誤答すると制限時間が<strong>5秒減少</strong>します</p>
      <button id="toExample" class="btn">次へ</button>
    </section>

    <!-- EXAMPLE -->
    <section id="example" class="screen gameScreen exampleScreen">
      <div class="exampleHeading">例題</div>

      <div class="missionArea">
        <div class="targetLine">
          <span id="exampleTargetNumber">1</span>
          <span class="findText">を探せ</span>
        </div>

        <input id="exampleAnswer" class="answerBox" type="text" maxlength="1"
               autocomplete="off" spellcheck="false" aria-label="例題のアルファベット入力">

        <div id="exampleKeyboard" class="keyboard" aria-label="例題用アルファベットキーボード"></div>
      </div>

      <div id="exampleMessage" class="message"></div>
    </section>

    <!-- CLEAR CONDITIONS -->
    <section id="conditions" class="screen">
      <h2>クリア条件</h2>
      <p class="conditionText">150秒以内に8問正解</p>
      <button id="gameStart" class="btn">START</button>
    </section>

    <!-- COUNTDOWN -->
    <section id="countdown" class="screen">
      <div id="countdownNumber">3</div>
    </section>

    <!-- GAME -->
    <section id="game" class="screen gameScreen">
      <div class="gameTop">
        <div class="missionTitle" id="missionTitle">MISSION 1</div>
        <div class="timer" id="timer">90</div>
      </div>

      <div class="missionArea">
        <div class="targetLine">
          <span id="targetNumber">47</span>
          <span class="findText">を探せ</span>
        </div>

        <input id="answer" class="answerBox" type="text" maxlength="1"
               autocomplete="off" spellcheck="false" aria-label="アルファベット入力">

        <div id="keyboard" class="keyboard" aria-label="アルファベットキーボード"></div>
      </div>

      <div id="message" class="message"></div>
    </section>

    <!-- CLEAR -->
    <section id="clear" class="screen resultScreen clearScreen">
      <div class="resultFx clearFx" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="resultBadge clearBadge">MISSION COMPLETE</div>
      <div class="result clearResult">CLEAR!</div>
      <div class="clearLine"><span class="clearCheck">✓</span> ALL 8 MISSIONS CLEARED</div>
      <p>次のステージに進んでください</p>
      <button id="retryFromClear" class="btn smallBtn">STAGE 1へ戻る</button>
    </section>

    <!-- FAILED -->
    <section id="failed" class="screen resultScreen failedScreen">
      <div class="resultFx failedFx" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="resultBadge failedBadge">MISSION FAILED</div>
      <div class="result failedResult">FAILED</div>
      <div class="failedLine">TIME OUT</div>
      <p>時間切れです。もう一度挑戦してください</p>
      <button id="retryFromFailed" class="btn smallBtn">もう一度挑戦</button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
